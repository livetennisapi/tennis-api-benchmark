name: regional-probe

# Times one public, keyless URL from Globalping probes on six continents and from this runner,
# then appends the rows to probes.csv on the regional-probe-data branch. Method and caveats:
# results/regional-probe/README.md. Free: public-repo Actions minutes and Globalping's anonymous
# limit (250 tests an hour; a run uses 12).

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regional-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TARGET_URL: https://api.livetennisapi.com/api/public/v1/health
      DATA_BRANCH: regional-probe-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DATA_BRANCH }}
          path: data
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Probe
        run: python -m benchmark.regional probe --url "$TARGET_URL" --out data/probes.csv
      - name: Commit the rows
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probes.csv
          git diff --cached --quiet && exit 0
          git commit -q -m "Regional probe $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git push -q origin "HEAD:$DATA_BRANCH" && exit 0
            git pull -q --rebase origin "$DATA_BRANCH"
          done
          exit 1
